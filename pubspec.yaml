version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0
  shared_preferences: ^2.2.3
  share_plus: ^11.0.0
  speech_to_text: ^7.0.0
  loading_animation_widget: ^1.3.0
  path_provider: ^2.1.2
  flutter_tts: ^4.0.2
